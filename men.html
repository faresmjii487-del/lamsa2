<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>الملابس الرجالية</title>
    <style>
        body {
            font-family: sans-serif;
            background: #000;
            color: #fff;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: auto;
            padding-top: 50px;
        }
        .item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        img {
            width: 250px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>الملابس الرجالية</h1>

    <div class="container">

        <div class="item">
            <img src="hodei1.jpg" alt="">
            <p>سويت شيرت رجالي - 12 د.ك</p>
        </div>

        <div class="item">
            <img src="hodei2.jpg" alt="">
            <p>بلوفر رجالي - 10 د.ك</p>
        </div>

        <div class="item">
            <img src="hodei3.jpg" alt="">
            <p>هودي رجالي - 15 د.ك</p>
        </div>

    </div>

</body>
</html>
