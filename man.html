<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأقسام</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: 20px;
            color: #333;
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .category {
            width: 250px;
            cursor: pointer;
        }

        .category img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 15px;
            transition: 0.3s;
        }

        .category img:hover {
            transform: scale(1.05);
        }

        .category p {
            margin-top: 10px;
            font-size: 20px;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>الأقسام</h1>

    <div class="categories">

        <!-- قسم الرجالي -->
        <a href="men.html" class="category">
            <img src=prod1.jpg"" alt="رجالي">
            <p>رجالي</p>
        </a>

        <!-- قسم النسائي -->
        <a href="women.html" class="category">
            <img src="prod4.jpg" alt="نسائي">
            <p>نسائي</p>
        </a>

        <!-- قسم الأطفال -->
        <a href="kids.html" class="category">
            <img src="prod3.jpg" alt="أطفال">
            <p>أطفال</p>
        </a>

    </div>

</body>
</html>
